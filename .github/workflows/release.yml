# Releases, worked out from the Conventional Commits on main by release-please
# (https://github.com/googleapis/release-please-action):
#
# 1. Every push to main updates the release pull request: the next version number and its
#    CHANGELOG.md entry. During 0.x, feat bumps the minor version (0.1.0 → 0.2.0), fix the patch
#    version, and breaking changes the minor version too.
# 2. Merging that pull request tags the version (v0.2.0) and creates the GitHub release. This
#    workflow then builds the Docker image for amd64 and arm64 and publishes it as
#    ghcr.io/<owner>/home-rank:0.2.0, :0.2 and :latest, with an SBOM, build provenance and a
#    signature. Once it is published, compose.yaml and .env.example are attached to the release:
#    self-hosters download them from there (docs/self-hosting.md).
#
# Configuration: release-please-config.json; .release-please-manifest.json holds the current
# version. The release pull request also updates the image version in compose.yaml.
name: Release

on:
  push:
    branches: [main]

# One release at a time, and never cancel one halfway.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to tag versions and create releases
      pull-requests: write # to open and update the release pull request
      issues: write # to label the release pull request
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Pull requests opened with the built-in GITHUB_TOKEN start no workflows, so CI would
          # not run on the release pull request. A personal access token in the
          # RELEASE_PLEASE_TOKEN secret fixes that; without it, this still works. A repository
          # secret is enough: this workflow only runs on pushes to main, never for pull requests.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }} # zizmor: ignore[secrets-outside-env]

  image:
    name: Publish Docker image
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # to push to ghcr.io
      id-token: write # to sign the image with cosign, without a stored key
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/home-rank
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Emulates arm64, so one job builds both images. Slower than native runners, but releases
      # are rare. No build cache: a release is built from scratch.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags 0.2.0, 0.2 and latest (and 1 once there is a 1.x), plus the standard OCI labels.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.tag }},enable=${{ !startsWith(needs.release-please.outputs.tag, 'v0.') }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attached to the image: what's inside (SBOM) and how it was built (provenance).
          sbom: true
          provenance: mode=max
      # Proves the image came from this workflow:
      #   cosign verify ghcr.io/<owner>/home-rank:<version> \
      #     --certificate-identity-regexp '^https://github\.com/<owner>/Home-Rank/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  files:
    name: Attach the Compose files
    # Only after the image is published: the compose.yaml of the latest release must never point
    # at an image that doesn't exist yet.
    needs: [release-please, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to add files to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Attach compose.yaml and .env.example
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" compose.yaml .env.example --clobber

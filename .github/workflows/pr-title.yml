# Pull requests are squash-merged, so their title becomes the commit message on main. It must
# follow Conventional Commits with the same types as the commit-msg hook in
# .pre-commit-config.yaml; release-please builds the changelog from them.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Editing the title again cancels the check of the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read # to read the title

jobs:
  conventional-commit:
    name: Conventional Commit title
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert

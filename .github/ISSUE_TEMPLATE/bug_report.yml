name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag (e.g. 0.3.1), or the commit if you build from source (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How do you run Home-Rank?
      options:
        - Docker Compose, as in docs/self-hosting.md
        - Docker, set up differently
        - Development setup (just dev)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Relevant lines from `docker compose logs web worker`, if any. Check them for passwords,
        tokens and other personal data before posting.
      render: text

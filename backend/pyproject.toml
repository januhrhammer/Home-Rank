[project]
name = "home-rank"
version = "0.0.0"
description = "Self-hosted chess database and training app"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "chess>=1.11.2",
    "django>=6.1,<6.2",
    "django-axes>=8.3.1",
    "django-environ>=0.14.0",
    "django-ninja>=1.7.1",
    "gunicorn>=26.2.0",
    "procrastinate[django]>=3.10.0",
    "psycopg[binary]>=3.3.6",
    "structlog>=26.1.0",
    "whitenoise>=6.12.0",
]

[tool.uv]
# This is a Django application, not a library: nothing gets built or published as a package.
# uv only manages the virtualenv and the lockfile; code runs from this directory.
package = false

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "import-linter>=2.15",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", # pycodestyle: basic style errors and warnings
    "F",      # pyflakes: unused imports, undefined names
    "I",      # import sorting
    "N",      # PEP 8 naming
    "UP",     # use modern Python syntax
    "B",      # bugbear: likely bugs
    "A",      # don't shadow builtins
    "C4",     # cleaner comprehensions
    "SIM",    # simplifications
    "RUF",    # ruff's own rules
    "S",      # bandit: security problems
    "PT",     # pytest style
    "PL",     # pylint
    "TRY",    # exception handling
    "DTZ",    # no timezone-naive datetimes
    "T20",    # no print()
    "ERA",    # no commented-out code
    "DJ",     # Django
]

[tool.ruff.lint.per-file-ignores]
# Settings modules inherit from base.py with `from .base import *`, Django's usual pattern.
"config/settings/*.py" = ["F403"]
# The dev and test settings use fixed, throwaway secret keys on purpose.
"config/settings/{dev,test}.py" = ["S105"]
# Generated migrations: Django writes help texts as long strings that can't be wrapped, and its
# Migration class declares dependencies/operations as plain class-level lists by design.
"**/migrations/*.py" = ["E501", "RUF012"]
# pytest works with plain assert statements, and tests use fake secrets and passwords.
"**/tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["."]
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]

[[tool.mypy.overrides]]
# django-environ and django-axes ship no type information.
module = ["environ", "axes.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.importlinter]
root_packages = ["homerank"]
# Lets contracts name third-party packages such as django.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "chesslib and engine are pure Python, without Django"
type = "forbidden"
source_modules = ["homerank.chesslib", "homerank.engine"]
# import-linter sees third-party packages as single boxes and can't tell that ninja imports
# django, so Django's ecosystem is listed explicitly ("config" is our Django settings package).
# Imports of our own Django-using modules (e.g. homerank.core) are caught via the import chain.
forbidden_modules = ["django", "ninja", "procrastinate", "axes", "environ", "config"]
broken_contract_guidance = """
chesslib and engine must work without Django. Keep the Django part (models, settings, tasks)
in a Django app and pass plain Python data into chesslib/engine instead."""

[tool.pytest]
DJANGO_SETTINGS_MODULE = "config.settings.test"
# Fail on typos in config, unknown markers and xfail tests that unexpectedly pass.
strict = true
# Turn warnings into errors, so deprecations in our dependencies surface while they're easy to
# fix. A warning we can't fix gets a specific "ignore:..." entry here, with the reason.
filterwarnings = ["error"]

[tool.coverage.run]
# Measured with `just test-backend --cov` (CI does). Tests and migrations aren't code under test.
source = ["config", "homerank"]
omit = ["*/tests/*", "*/migrations/*"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true
